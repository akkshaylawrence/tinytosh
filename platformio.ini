; Builds the firmware with ESP-IDF settings the prebuilt Arduino core cannot change.
;
; The core's ESP32-C3 libraries size Bluetooth for three connections in every role, with BLE Mesh,
; and give TLS a 16 KB send buffer. The Bluetooth mouse then left about 50 KB free, under the
; 56 KB an HTTPS request needs, so every fetch after boot was skipped. custom_sdkconfig makes
; pioarduino rebuild those libraries with the settings below.
[platformio]
src_dir = TinytoshESP32

[env:tinytosh]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    tzapu/WiFiManager @ 2.0.17
    bblanchon/ArduinoJson @ 6.21.5
    adafruit/Adafruit SSD1306 @ 2.5.17
    adafruit/Adafruit GFX Library @ 1.12.6
    adafruit/Adafruit BusIO @ 1.17.4
    mathertel/OneButton @ 2.6.2
    knolleary/PubSubClient @ 2.8
custom_sdkconfig =
    CONFIG_BLE_MESH=n
    CONFIG_BT_NIMBLE_ROLE_CENTRAL=n
    CONFIG_BT_NIMBLE_ROLE_OBSERVER=n
    CONFIG_BT_NIMBLE_50_FEATURE_SUPPORT=n
    CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    CONFIG_BT_CTRL_BLE_MAX_ACT=2
    CONFIG_MBEDTLS_ASYMMETRIC_CONTENT_LEN=y
    CONFIG_MBEDTLS_SSL_IN_CONTENT_LEN=16384
    CONFIG_MBEDTLS_SSL_OUT_CONTENT_LEN=4096
    CONFIG_MBEDTLS_SSL_PROTO_DTLS=n
    CONFIG_MBEDTLS_DYNAMIC_BUFFER=y
    CONFIG_MBEDTLS_DYNAMIC_FREE_CONFIG_DATA=y
    CONFIG_MBEDTLS_DYNAMIC_FREE_CA_CERT=y
