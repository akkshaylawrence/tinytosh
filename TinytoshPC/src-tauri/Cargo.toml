[package]
name = "tinytosh-pc"
version = "1.3.2"
description = "Tinytosh PC"
authors = ["UladzimirHitsarau"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-ico", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.32"
serialport = "4.6"
ureq = "2.12"
mdns-sd = "0.18.1"
mac_address = "1.1.8"
any_ascii = "0.3"
roxmltree = "0.20"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"

[target.'cfg(not(target_os = "macos"))'.dependencies]
nowhear = "0.2.0"
futures = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
mediaremote-rs = "0.2.0"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSNotification", "NSString", "NSArray", "NSOperation"] }
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSRunningApplication", "block2"] }
